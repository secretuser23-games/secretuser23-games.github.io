<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>MVC 3 Text Guide</title>
        <style>
            *{
                background-color: black;
                color: white;
                justify-content: center;
                align-items: center;
                text-align: center;
            }
            .redA{
                color: red;
            }
            .orgA{
                color: orange;
            }
            .ylwA{
                color: yellow;
            }
            .grnA{
                color: green;
            }
            .lbluA{
                color: skyblue;
            }
            .dbluA{
                color: navy;
                background-color: white;
            }
            .pplA{
                color: purple;
                background-color: white;
            }
            .pnkA{
                color: #ff0088;
            }
            .whtA{
                color: white;
            }
            .gryA{
                color: #888888;
            }
            .blkA{
                color: black;
                background-color: white;
            }
            .brnA{
                color: saddlebrown;
            }
            .blur{
                filter: blur(1px)   
            }
            .rbwA{
                background-image: linear-gradient(
                    to right,
                    #ff0000,
                    #ff7f00,
                    #ffff00,
                    #00ff00,
                    #0000ff,
                    #4b0082,
                    #9400d3,
                    #ff0000
                );
                background-size: 200% auto;
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                display: inline-block;
                animation: rainbow-shift 1s linear infinite;
            }

            @keyframes rainbow-shift {
                0% {
                    background-position: 0% center;
                }
                100% {
                    background-position: 200% center;
                }
            }
        </style>
    </head>
    <body>

        <button onclick="openPage('../../index.html')">Back Home</button>
        
        <script>
  function openPage(pageID) {
    // 1. If we are inside an iframe, tell the parent page to navigate
    if (window.parent !== window) {
      window.parent.postMessage({ action: 'navigate', url: pageID }, '*');
      
      // Safety fallback: If the parent is Phoenix Code (not an enemy page), 
      // it won't respond to the message, so navigate inside the current frame after 50ms.
      setTimeout(() => {
        window.location.href = pageID;
      }, 50);
    } else {
      // 2. If opened directly as the standalone Home Page, navigate normally
      window.location.href = pageID;
    }
  }
</script>
