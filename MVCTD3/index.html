<!doctype html>
<html lang="en">
    <head>
        <title>Main Menu - MVC TD 3</title>
        <link rel="stylesheet" type="text/css" href="index.css" />
        <link rel="icon" type="image/png" href="images/logo.png" />
    </head>
    <body>
        <table id="mainMenuTable">
            <thead>
                <tr>
                    <td><button class="optionButton">Options:</button></td>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><button class="optionButton fullButton" onclick="openSingularMenu('gameOptions')">Play Game</button></td>
                </tr>
                <tr>
                    <td><button class="optionButton fullButton">Settings</button></td>
                </tr>
                <tr>
                    <td><button class="optionButton fullButton" onclick="confirmClose()">Exit Game (closes tab)</button></td>
                </tr>
            </tbody>
        </table>
        <div id="playGame" class="closedMenu">
            <table id="mapChoiceMenu">
                <thead>
                    <tr>
                        <td class="sideBar">Map Choices:</td>
                        <td class="fullBar">Column 1:</td>
                        <td class="fullBar">Column 2:</td>
                        <td class="fullBar">Column 3:</td>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="sideBar">Row 1:</td>
                        <td class="fullBar">
                            <button onclick="openMap(1)" class="optionButton">Round and Round the Plains<br><img class="mapImages" src="images/mapImages/map1.png"></button>
                        </td>
                        <td class="fullBar">
                            <button onclick="openMap(2)" class="optionButton">Crossroads<br><img class="mapImages" src="images/mapImages/map2.png"></button>
                        </td>
                        <td class="fullBar">Coming soon!</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <script src="mainmenu.js" defer></script>
    </body>
</html>
